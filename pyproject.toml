[project]
name = "bughunter"
version = "0.1.0"
description = "Bug-hunting coding agent"
requires-python = ">=3.9"
dependencies = [
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-python>=0.23,<0.24",
    "ruff>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bughunter = "bughunter.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bughunter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
